<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Night CV Portfolio</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <div id="container">
        <div id="ui">
            <h1>Tokyo Night CV</h1>
            <div class="subtitle">Explore the city to discover my experience and skills</div>
        </div>
        
        <div id="cv-display">
            <button id="close-cv">×</button>
            <h2>My CV</h2>
            <div id="cv-content">
                <!-- CV content will be populated by JavaScript -->
            </div>
        </div>
        
        <div id="instructions">
            Use WASD or arrow keys to move around • Press E to interact with buildings
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Tokyo Night...</p>
        </div>
    </div>

    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
